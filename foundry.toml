[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
ffi = false

[rpc_endpoints]
robinhood = "${RH_RPC_URL}"

[profile.fork]
# Official public RPC: https://docs.robinhood.com/chain/connecting/
fork_url = "${RH_RPC_URL}"
fork_chain_id = 4663
